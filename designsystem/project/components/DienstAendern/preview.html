<!-- @dsCard group="Kalender" height=820 width=620 subtitle="„Wer ändert?“ ist Pflicht" -->
<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>DienstAendern</title></head>
<body class="nu" style="margin:0;background:var(--grund)">
<div class="nu" style="width:620px;background:var(--grund);padding:20px">
<div style="background:var(--flaeche);border-radius:16px;padding:22px;display:grid;gap:14px;box-shadow:var(--schatten-schwebend)"><div><b class="titel">Betreuung 2 am 03.10. ändern</b><p class="nu-beschr" style="margin:4px 0 0">Originalplan: Jule</p></div>
<div class="nu-feld"><span class="nu-feldname">Wer macht den Dienst?</span><div class="nu-checkliste" data-wahl><button class="nu-chip" aria-pressed="false">Kim</button><button class="nu-chip" aria-pressed="false">Sam</button><button class="nu-chip" aria-pressed="false">Robin</button><button class="nu-chip" aria-pressed="true"><i data-icon="check" class="klein"></i>Chris</button><button class="nu-chip" aria-pressed="false">Jule</button><button class="nu-chip" aria-pressed="false">Mika</button><button class="nu-chip" aria-pressed="false">offen</button></div></div>
<div class="nu-feld" id="vf"><span class="nu-feldname">Wer ändert?</span><div class="nu-checkliste" id="von"><button class="nu-chip" aria-pressed="false">Leitung (Schwester)</button><button class="nu-chip" aria-pressed="false">Kim</button><button class="nu-chip" aria-pressed="false">Sam</button><button class="nu-chip" aria-pressed="false">Robin</button><button class="nu-chip" aria-pressed="false">Chris</button><button class="nu-chip" aria-pressed="false">Jule</button><button class="nu-chip" aria-pressed="false">Mika</button></div><span class="nu-beschr" id="vh">Bitte auswählen. Die Änderung wird mit Namen vermerkt.</span></div>
<div class="nu-feld"><span class="nu-feldname">Grund</span><div class="nu-seg" role="radiogroup"><button role="radio" aria-checked="true">Tausch</button><button role="radio" aria-checked="false">Sonstiges</button></div></div>
<div class="nu-feld"><label>Notiz (freiwillig)</label><input class="nu-eingabe" placeholder="z. B. getauscht mit 14.10."></div>
<div style="display:flex;gap:10px;justify-content:flex-end"><button class="nu-btn nu-btn--klein">Abbrechen</button><button class="nu-btn nu-btn--primaer nu-btn--klein" id="sp">Speichern</button></div></div></div><script>document.querySelectorAll("[data-wahl]").forEach(function(g){g.querySelectorAll(".nu-chip").forEach(function(c){c.onclick=function(){g.querySelectorAll(".nu-chip").forEach(function(x){var an=x===c,t=x.textContent;x.setAttribute("aria-pressed",String(an));x.innerHTML=(an?Nu.svg("check","klein"):"")+t;});};});});</script><script>var v=document.getElementById("von"),h=document.getElementById("vh");v.querySelectorAll(".nu-chip").forEach(function(c){c.onclick=function(){v.querySelectorAll(".nu-chip").forEach(function(x){x.setAttribute("aria-pressed",String(x===c));});h.style.color="";h.textContent="Wird vermerkt: geändert von "+c.textContent+".";};});
document.getElementById("sp").onclick=function(){if(!v.querySelector('[aria-pressed="true"]')){h.style.color="var(--vorfall)";h.textContent="Bitte zuerst auswählen, wer ändert.";var f=document.getElementById("vf");f.classList.remove("is-wackeln");void f.offsetWidth;f.classList.add("is-wackeln");}else{h.textContent="Gespeichert. Der Kalender markiert den Dienst als geändert.";}};</script>
<script>Nu.mountIcons();</script>
</body>
</html>
